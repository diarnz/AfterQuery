services:
  db:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_DB: runbook
      POSTGRES_USER: runbook
      POSTGRES_PASSWORD: ${RUNBOOK_DB_PASSWORD:-runbook-local}
    ports:
      - "127.0.0.1:${RUNBOOK_DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "runbook", "-d", "runbook"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
