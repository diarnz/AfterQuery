[project]
name = "renaissance-runbook"
version = "0.1.0"
description = "Agent evaluation environments and training tooling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128,<1",
    "uvicorn>=0.40,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "ruff>=0.15,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["runbook"]

[tool.ruff]
target-version = "py312"
